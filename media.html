<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transversal Labs — Media</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .placeholder {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: var(--nav-height);
      text-align: center;
    }
    .placeholder__inner { max-width: 480px; }
    .placeholder__label {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-primary);
      margin: var(--space-5) 0 var(--space-4);
    }
    .placeholder__note {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: var(--space-6);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <img src="images/TL-logo-transparent.png" alt="Transversal Labs" class="nav__logo-img" />
        <div class="nav__logo-text">
          <span class="nav__logo-name">Transversal Labs</span>
          <span class="nav__logo-sub">Digital Products &amp; Consulting</span>
        </div>
      </a>
      <ul class="nav__links" id="nav-links">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="work.html" class="nav__link">Work</a></li>
        <li><a href="afi.html" class="nav__link">AFI App</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
        <li><a href="media.html" class="nav__link">Media</a></li>
        <li><a href="contact.html" class="nav__link nav__cta">Contact</a></li>
      </ul>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="placeholder">
    <div class="placeholder__inner">
      <span class="eyebrow">Coming Soon</span>
      <p class="placeholder__label">Media</p>
      <p class="placeholder__note">This page is under construction. Check back soon.</p>
      <a href="index.html" class="btn btn--outline">← Back to Home</a>
    </div>
  </div>
  <script>
    const toggle = document.getElementById('nav-toggle');
    const links  = document.getElementById('nav-links');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
  </script>
</body>
</html>
